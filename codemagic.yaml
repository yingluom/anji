workflows:
  ios-build:
    name: Anji iOS — Unsigned IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: 16.0
      vars:
        XCODE_PROJECT: AnjiApp/AnjiApp.xcodeproj
        XCODE_SCHEME: AnjiApp

    # Minimal, safe caches. Only caches stuff outside the workspace that
    # Codemagic reliably preserves. Skips risky/huge caches like Homebrew
    # Cellar that can stall the runner.
    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
        - $HOME/.rustup
        - $HOME/Library/Caches/org.swift.swiftpm

    scripts:
      # ---------------------------------------------------------------------
      - name: Install toolchain
        script: |
          set -euxo pipefail

          # Rust (idempotent — reuses cached toolchain if present)
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

          # Build tools
          brew install protobuf swift-protobuf xcodegen

          rustc --version
          cargo --version
          protoc --version
          xcodegen --version

      # ---------------------------------------------------------------------
      - name: Fetch submodules
        script: |
          set -euxo pipefail
          git submodule update --init --recursive --jobs 4

      # ---------------------------------------------------------------------
      - name: Build Rust XCFramework
        script: |
          set -euxo pipefail
          source "$HOME/.cargo/env"
          chmod +x scripts/build-xcframework.sh
          ./scripts/build-xcframework.sh
          [ -d AnkiRust.xcframework ] || { echo "ERROR: XCFramework missing"; exit 1; }

      # ---------------------------------------------------------------------
      - name: Generate protobufs & Xcode project
        script: |
          set -euxo pipefail
          chmod +x scripts/generate-protos.sh
          ./scripts/generate-protos.sh
          (cd AnjiApp && xcodegen generate)
          [ -d "$XCODE_PROJECT" ] || { echo "ERROR: Xcode project not generated"; exit 1; }

      # ---------------------------------------------------------------------
      - name: Archive (ad-hoc signed)
        script: |
          set -euxo pipefail

          # Xcode 16 macro/plugin trust (CI can't approve interactively)
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

          rm -rf build

          # Ad-hoc ("-") signing produces a complete bundle that self-sign tools
          # (SideStore / ESign / Sideloadly / AltStore) can strip and re-sign.
          # CODE_SIGNING_ALLOWED=NO would skip resource/Swift-lib embedding — DO NOT use.
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AnjiApp.xcarchive \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_BITCODE=NO \
            DEVELOPMENT_TEAM=""

      # ---------------------------------------------------------------------
      - name: Package & verify IPA
        script: |
          set -euxo pipefail

          APP="build/AnjiApp.xcarchive/Products/Applications/AnjiApp.app"
          EXE="$APP/AnjiApp"

          [ -d "$APP" ]             || { echo "ERROR: .app missing"; exit 1; }
          [ -f "$EXE" ]             || { echo "ERROR: executable missing"; exit 1; }
          [ -f "$APP/Info.plist" ]  || { echo "ERROR: Info.plist missing"; exit 1; }

          echo "=== Binary ==="
          file "$EXE"
          lipo -info "$EXE" || true

          APP_KB=$(du -sk "$APP" | cut -f1)
          echo "Bundle size: ${APP_KB}KB"
          [ "$APP_KB" -gt 500 ] || { echo "ERROR: .app ${APP_KB}KB — build broken"; exit 1; }

          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -ry ../AnjiApp-unsigned.ipa Payload)

          IPA=build/AnjiApp-unsigned.ipa
          IPA_SIZE=$(stat -f%z "$IPA")
          echo "==> IPA: $IPA ($(du -h "$IPA" | cut -f1), $IPA_SIZE bytes)"
          [ "$IPA_SIZE" -gt 500000 ] || { echo "ERROR: IPA <500KB"; exit 1; }

          echo "=== IPA contents ==="
          unzip -l "$IPA" | head -30

    artifacts:
      - build/AnjiApp-unsigned.ipa
