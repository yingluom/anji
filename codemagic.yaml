workflows:
  ios-unsigned:
    name: Anji iOS — Unsigned IPA
    max_build_duration: 120
    environment:
      xcode: latest

    scripts:
      - name: Install Rust + build tools
        script: |
          set -e
          brew install protobuf swift-protobuf xcodegen
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustc --version
          protoc --version
          xcodegen --version

      - name: Checkout submodules
        script: |
          set -e
          git submodule update --init --recursive

      - name: Build Rust XCFramework
        script: |
          set -e
          source "$HOME/.cargo/env"
          bash scripts/build-xcframework.sh

      - name: Generate protobufs & Xcode project
        script: |
          set -e
          bash scripts/generate-protos.sh
          cd AnjiApp
          xcodegen generate
          cd ..

      - name: Trust Xcode 16 macros
        script: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Archive (ad-hoc signed)
        script: |
          set -e
          rm -rf build
          xcodebuild archive \
            -project AnjiApp/AnjiApp.xcodeproj \
            -scheme AnjiApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AnjiApp.xcarchive \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            DEBUG_INFORMATION_FORMAT=dwarf \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_BITCODE=NO \
            DEVELOPMENT_TEAM=""

      - name: Package IPA & verify
        script: |
          set -e
          APP="build/AnjiApp.xcarchive/Products/Applications/AnjiApp.app"

          if [ ! -f "$APP/AnjiApp" ]; then
            echo "ERROR: executable missing at $APP/AnjiApp"
            exit 1
          fi

          APP_KB=$(du -sk "$APP" | cut -f1)
          echo "App bundle size: ${APP_KB}KB"
          if [ "$APP_KB" -lt 500 ]; then
            echo "ERROR: bundle is only ${APP_KB}KB — build produced empty bundle"
            exit 1
          fi

          file "$APP/AnjiApp"

          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -ry ../AnjiApp-unsigned.ipa Payload
          cd ../..

          ls -lh build/AnjiApp-unsigned.ipa
          unzip -l build/AnjiApp-unsigned.ipa | head -20

    artifacts:
      - build/AnjiApp-unsigned.ipa
