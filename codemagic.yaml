workflows:
  ios-build:
    name: Anji iOS — Unsigned IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: 16.0
      vars:
        XCODE_PROJECT: AnjiApp/AnjiApp.xcodeproj
        XCODE_SCHEME: AnjiApp
        # Speed up Xcode: turn off indexing, compile in release mode
        XCODE_FAST_FLAGS: >-
          COMPILER_INDEX_STORE_ENABLE=NO
          SWIFT_COMPILATION_MODE=wholemodule

    cache:
      cache_paths:
        # Rust toolchain & dependency source cache
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
        - $HOME/.rustup
        # Rust compiled artifacts — biggest speed win on subsequent builds
        - $CM_BUILD_DIR/anki-bridge-rs/target
        # SwiftPM package cache
        - $HOME/Library/Caches/org.swift.swiftpm
        # Pre-built XCFramework (only re-zipped if fingerprint changes)
        - $CM_BUILD_DIR/AnkiRust.xcframework

    scripts:
      - name: Install Rust toolchain
        script: |
          set -euo pipefail
          if ! command -v rustup &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustc --version && cargo --version

      - name: Install build tools
        script: |
          set -euo pipefail
          # `|| true` tolerates "already installed" from brew
          brew install protobuf swift-protobuf xcodegen || true
          protoc --version
          xcodegen --version

      - name: Checkout git submodules
        script: |
          set -euo pipefail
          # --jobs for parallel clone of nested submodules
          git submodule update --init --recursive --jobs 4

      - name: Build Rust XCFramework
        script: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          chmod +x scripts/build-xcframework.sh
          ./scripts/build-xcframework.sh
          # Sanity check
          [ -d "AnkiRust.xcframework" ] || { echo "XCFramework not produced"; exit 1; }

      - name: Generate Swift Protobuf types
        script: |
          set -euo pipefail
          chmod +x scripts/generate-protos.sh
          ./scripts/generate-protos.sh

      - name: Generate Xcode project
        script: |
          set -euo pipefail
          (cd AnjiApp && xcodegen generate)
          [ -d "$XCODE_PROJECT" ] || { echo "Xcode project not generated"; exit 1; }

      - name: Trust SwiftPM macros & plugins
        script: |
          # Xcode 16 requires explicit fingerprint approval for SwiftPM macros/plugins.
          # CI cannot approve interactively, so disable validation via defaults.
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDEPackageSupportUseBuiltinSCM -bool YES

      - name: Archive with ad-hoc signing
        script: |
          set -euo pipefail

          # Clean previous build artifacts to avoid stale bundles
          rm -rf build

          # Use ad-hoc signing ("-") instead of skipping signing entirely.
          # CODE_SIGNING_ALLOWED=NO causes Xcode 16 to skip resource packaging
          # and Swift runtime embedding — resulting in a near-empty .app.
          # Ad-hoc produces a complete bundle with a fake signature that
          # re-sign tools (SideStore/ESign/Sideloadly/etc.) strip & replace.
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AnjiApp.xcarchive \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            $XCODE_FAST_FLAGS \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
            ENABLE_BITCODE=NO \
            DEVELOPMENT_TEAM=""

      - name: Verify archive contents
        script: |
          set -euo pipefail

          APP="build/AnjiApp.xcarchive/Products/Applications/AnjiApp.app"
          EXE="$APP/AnjiApp"

          [ -d "$APP" ]             || { echo "ERROR: .app missing at $APP"; exit 1; }
          [ -f "$EXE" ]             || { echo "ERROR: executable missing at $EXE"; exit 1; }
          [ -f "$APP/Info.plist" ]  || { echo "ERROR: Info.plist missing"; exit 1; }

          # Binary must be a valid arm64 iOS Mach-O
          echo "=== Binary info ==="
          file "$EXE"
          lipo -info "$EXE" || true

          # Non-empty executable check
          EXE_SIZE=$(stat -f%z "$EXE")
          echo "Executable size: $EXE_SIZE bytes"
          [ "$EXE_SIZE" -gt 100000 ] || { echo "ERROR: executable suspiciously small (<100KB)"; exit 1; }

          # Bundle listing
          echo "=== .app top-level ==="
          ls -la "$APP"
          echo "=== Frameworks/ (Swift runtime should be here) ==="
          ls -la "$APP/Frameworks" 2>/dev/null || echo "(no Frameworks dir — OK on iOS 12.2+)"
          echo "=== _CodeSignature/ ==="
          ls -la "$APP/_CodeSignature" 2>/dev/null || echo "(no signature dir)"

          # Total bundle size
          APP_SIZE_KB=$(du -sk "$APP" | cut -f1)
          echo "Bundle size: ${APP_SIZE_KB}KB"
          [ "$APP_SIZE_KB" -gt 500 ] || {
              echo "ERROR: .app is only ${APP_SIZE_KB}KB — build produced a near-empty bundle"
              exit 1
          }

      - name: Package unsigned IPA
        script: |
          set -euo pipefail

          APP="build/AnjiApp.xcarchive/Products/Applications/AnjiApp.app"

          # xcodebuild -exportArchive needs a real cert for ad-hoc method,
          # so we package manually: Payload/AnjiApp.app → zip → .ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -ry ../AnjiApp-unsigned.ipa Payload)

          IPA=build/AnjiApp-unsigned.ipa
          IPA_SIZE=$(stat -f%z "$IPA")
          echo "==> IPA: $IPA ($(du -h "$IPA" | cut -f1), $IPA_SIZE bytes)"

          # Sanity check: any real iOS app IPA is >= several MB
          [ "$IPA_SIZE" -gt 500000 ] || {
              echo "ERROR: IPA is only $IPA_SIZE bytes — packaging broken"
              exit 1
          }

          # Dump IPA contents for inspection
          echo "=== IPA contents ==="
          unzip -l "$IPA" | head -40

    artifacts:
      - build/AnjiApp-unsigned.ipa
      - build/AnjiApp.xcarchive/**/*.app
