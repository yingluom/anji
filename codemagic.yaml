workflows:
  ios-build:
    name: Anji iOS — Unsigned IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: 16.0
      vars:
        XCODE_PROJECT: AnjiApp/AnjiApp.xcodeproj
        XCODE_SCHEME: AnjiApp

    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
        - $HOME/.rustup

    scripts:
      - name: Install Rust toolchain
        script: |
          if ! command -v rustup &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustup show

      - name: Install build tools
        script: |
          brew install protobuf swift-protobuf xcodegen || true

      - name: Checkout git submodules
        script: |
          git submodule update --init --recursive

      - name: Build Rust XCFramework
        script: |
          source "$HOME/.cargo/env"
          chmod +x scripts/build-xcframework.sh
          ./scripts/build-xcframework.sh

      - name: Generate Swift Protobuf types
        script: |
          chmod +x scripts/generate-protos.sh
          ./scripts/generate-protos.sh

      - name: Generate Xcode project
        script: |
          cd AnjiApp
          xcodegen generate
          cd ..

      - name: Trust SwiftPM macros & plugins
        script: |
          # Xcode 16 requires explicit fingerprint approval for SwiftPM macros/plugins.
          # On CI we cannot approve interactively, so skip validation via defaults.
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDEPackageSupportUseBuiltinSCM -bool YES

      - name: Resolve SPM dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -skipMacroValidation \
            -skipPackagePluginValidation

      - name: Build unsigned IPA
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath build/AnjiApp.xcarchive \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # Package unsigned IPA manually (xcodebuild -exportArchive requires signing)
          mkdir -p build/ipa/Payload
          cp -r build/AnjiApp.xcarchive/Products/Applications/AnjiApp.app build/ipa/Payload/
          cd build/ipa && zip -r ../AnjiApp-unsigned.ipa Payload

    artifacts:
      - build/AnjiApp-unsigned.ipa
      - build/AnjiApp.xcarchive/**/*.app
