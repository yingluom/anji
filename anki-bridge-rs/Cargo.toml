[package]
name = "anki-bridge-ios"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
anki = { path = "../anki-upstream/rslib", features = ["rustls"] }
anki_proto = { path = "../anki-upstream/rslib/proto" }
prost = "0.13"

[profile.release]
opt-level = "s"
lto = "thin"        # Thin LTO: ~3-5x faster linking than full LTO, negligible size impact
strip = true
codegen-units = 16  # Better parallelism during compilation
incremental = false # Incremental + release doesn't mix well in CI caches
