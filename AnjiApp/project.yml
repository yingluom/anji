name: AnjiApp
options:
  bundleIdPrefix: com.yingluom
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  AnjiBridge:
    path: ..
  swift-sharing:
    url: https://github.com/pointfreeco/swift-sharing
    from: 2.0.0
targets:
  AnjiApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: group
    dependencies:
      - package: AnjiBridge
        product: AnkiKit
      - package: AnjiBridge
        product: AnkiServices
      - package: AnjiBridge
        product: AnkiClients
      - package: AnjiBridge
        product: AnkiSync
      - package: AnjiBridge
        product: AnkiBackend
      - package: AnjiBridge
        product: AnkiProto
      - package: swift-sharing
        product: Sharing
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.yingluom.anji
        CODE_SIGN_ENTITLEMENTS: AnjiApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  AnjiApp:
    build:
      targets:
        AnjiApp: all
    run:
      config: Debug
