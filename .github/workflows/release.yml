name: Release IPA

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Install dependencies
        run: |
          brew install protobuf swift-protobuf xcodegen
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build XCFramework
        run: bash scripts/build-xcframework.sh

      - name: Generate Protobuf & Xcode Project
        run: |
          bash scripts/generate-protos.sh
          cd AnjiApp && xcodegen generate && cd ..

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project AnjiApp/AnjiApp.xcodeproj \
            -scheme AnjiApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AnjiApp.xcarchive \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_BITCODE=NO

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R "build/AnjiApp.xcarchive/Products/Applications/AnjiApp.app" build/ipa/Payload/
          cd build/ipa && zip -ry ../AnjiApp-unsigned.ipa Payload && cd ../..
          ls -lh build/AnjiApp-unsigned.ipa

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/AnjiApp-unsigned.ipa
          name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AnjiApp-unsigned
          path: build/AnjiApp-unsigned.ipa
