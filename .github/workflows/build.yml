name: Build IPA (optimized)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: build/spm_cache
          key: spm-${{ runner.os }}-${{ hashFiles('AnjiApp/AnjiApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            anki-bridge-rs/target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Cache XCFramework
        uses: actions/cache@v4
        with:
          path: build/AnkiBackend.xcframework
          key: xcfw-${{ runner.os }}-${{ hashFiles('anki-bridge-rs/Cargo.lock', 'scripts/build-xcframework.sh') }}
          restore-keys: xcfw-${{ runner.os }}-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Install dependencies
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install protobuf swift-protobuf xcodegen 2>/dev/null || true

      - name: Build XCFramework
        run: |
          if [ -f "build/AnkiBackend.xcframework/Info.plist" ]; then
            echo "✅ XCFramework cache hit, skipping build"
          else
            bash scripts/build-xcframework.sh
          fi

      - name: Generate Protobuf & Xcode Project
        run: |
          bash scripts/generate-protos.sh
          cd AnjiApp && xcodegen generate && cd ..

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AnjiApp/AnjiApp.xcodeproj \
            -scheme AnjiApp \
            -clonedSourcePackagesDirPath build/spm_cache

      - name: Build Archive (optimized)
        run: |
          mkdir -p build
          echo "Starting xcodebuild archive..."
          START=$(date +%s)

          xcodebuild archive \
            -project AnjiApp/AnjiApp.xcodeproj \
            -scheme AnjiApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AnjiApp.xcarchive \
            -clonedSourcePackagesDirPath build/spm_cache \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -parallelizeTargets \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_BITCODE=NO \
            2>&1

          RESULT=$?
          echo "--- Archive took $(( $(date +%s) - START ))s ---"

          if [ $RESULT -ne 0 ]; then
            echo "Build failed!"
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R "build/AnjiApp.xcarchive/Products/Applications/AnjiApp.app" build/ipa/Payload/
          cd build/ipa && zip -ry ../AnjiApp-unsigned.ipa Payload && cd ../..
          ls -lh build/AnjiApp-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnjiApp-unsigned
          path: build/AnjiApp-unsigned.ipa
          retention-days: 7

