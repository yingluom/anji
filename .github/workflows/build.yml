name: Build IPA (optimized)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache SPM dependencies
        uses: actions/cache@v3
        with:
          path: build/spm_cache
          key: spm-${{ runner.os }}-${{ hashFiles('AnjiApp/AnjiApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Cache Rust build
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/rust_build
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Cache Homebrew
        uses: actions/cache@v3
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: brew-${{ runner.os }}-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Install dependencies
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install protobuf swift-protobuf xcodegen 2>/dev/null || true

      - name: Build XCFramework
        run: |
          # Cache XCFramework if already built
          if [ -f "build/AnkiBackend.xcframework/Info.plist" ]; then
            echo "XCFramework found in cache, skipping build"
          else
            bash scripts/build-xcframework.sh
          fi

      - name: Generate Protobuf & Xcode Project
        run: |
          bash scripts/generate-protos.sh
          cd AnjiApp && xcodegen generate && cd ..

      - name: Build Archive (optimized)
        run: |
          xcodebuild archive \
            -project AnjiApp/AnjiApp.xcodeproj \
            -scheme AnjiApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AnjiApp.xcarchive \
            -clonedSourcePackagesDirPath build/spm_cache \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -parallelizeTargets \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_BITCODE=NO \
            2>&1 | tee build/xcodebuild.log

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Build failed! Errors:"
            grep -n "error:" build/xcodebuild.log | head -30
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R "build/AnjiApp.xcarchive/Products/Applications/AnjiApp.app" build/ipa/Payload/
          cd build/ipa && zip -ry ../AnjiApp-unsigned.ipa Payload && cd ../..
          ls -lh build/AnjiApp-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AnjiApp-unsigned
          path: build/AnjiApp-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7
